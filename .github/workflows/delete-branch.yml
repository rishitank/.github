# Deletes one named branch in one repository this account owns, by hand.
#
# branch-prune only deletes branches whose pull request merged in the same
# repository at the branch's tip. Some branches can never qualify: a fork's
# branch whose pull request was merged upstream, or a branch whose pull request
# was closed without merging (superseded by a re-cut). This deletes exactly one
# of those, after the checks in scripts/delete-branch.sh:
#   - the repository belongs to this account;
#   - the branch's tip is exactly the SHA you give. The REST delete has no
#     precondition, so this narrows, but cannot close, the seconds-long window
#     in which a new push could land and be lost;
#   - not the default branch, not a long-lived name (the prune's keep pattern),
#     not protected, and no open pull request uses it as its base here or as its
#     head anywhere in the fork network the token can read (parent, source or a
#     public sibling fork; someone else's private fork is invisible to it).
#
# DRY RUN BY DEFAULT: `mode` defaults to dry-run, which makes every check and
# reports. Only `mode: apply` deletes. The job summary prints the command that
# restores the branch at the same commit.
#
# TOKEN: the same fine-grained PAT as branch-prune, the repository secret
# ACCOUNT_ADMIN_TOKEN (this workflow needs Contents: Read and write and
# Pull requests: Read). GITHUB_TOKEN
# only reaches this repository. Every input reaches the shell through env. The
# job only runs from main, so a dispatch on another branch can never run an
# unreviewed copy of the script with this token.
name: delete-branch

on:
  workflow_dispatch:
    inputs:
      repository:
        description: Repository as owner/name. It must belong to this account.
        required: true
        type: string
      branch:
        description: Branch to delete. Never the default branch or a long-lived name.
        required: true
        type: string
      sha:
        description: Full 40-character commit SHA the branch must point at.
        required: true
        type: string
      mode:
        description: dry-run makes every check and reports; apply deletes.
        type: choice
        options:
          - dry-run
          - apply
        default: dry-run

permissions: {}

concurrency:
  group: delete-branch-${{ github.repository }}
  cancel-in-progress: false

jobs:
  delete:
    name: Delete one branch
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Checkout only. Every API call uses ACCOUNT_ADMIN_TOKEN, never GITHUB_TOKEN.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Delete the branch
        env:
          GH_TOKEN: ${{ secrets.ACCOUNT_ADMIN_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          REPOSITORY: ${{ inputs.repository }}
          BRANCH: ${{ inputs.branch }}
          SHA: ${{ inputs.sha }}
          MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN}" ]; then
            echo "::error title=delete-branch::ACCOUNT_ADMIN_TOKEN is not set. See branch-prune.yml for how to create it."
            exit 1
          fi
          bash scripts/delete-branch.sh --owner "${OWNER}" --repo "${REPOSITORY}" \
            --branch "${BRANCH}" --sha "${SHA}" --mode "${MODE}"
