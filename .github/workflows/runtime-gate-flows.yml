# Saves the flows the AI explorer recorded into the repository, so the
# deterministic crawl replays them on every PR with no model calls.
#
# Call it after the runtime-gate job in a scheduled or manually run workflow
# on the default branch (it does nothing on other events or branches):
#
#   flows:
#     needs: runtime
#     if: ${{ !cancelled() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
#     uses: <owner>/.github/.github/workflows/runtime-gate-flows.yml@<sha>
#     permissions:
#       contents: write        # push the runtime-gate/flows branch
#       pull-requests: write   # open or update its PR
#       actions: write         # start CI on that branch (see below)
#     with:
#       ci-workflows: ci.yml
#
# It opens (or updates) one PR from the branch `runtime-gate/flows` that
# changes only .github/runtime-gate-flows.json. A person reviews and merges it:
# recorded flows become part of the gate only once someone has looked at them.
#
# PRs opened with GITHUB_TOKEN do not start pull_request workflows, so the
# workflows named in `ci-workflows` (which must have a workflow_dispatch
# trigger) are started on the branch explicitly; their checks land on the PR's
# head commit. If the repository does not allow GitHub Actions to create pull
# requests, the branch is still pushed and the run prints a link to open one.
name: runtime-gate-flows

on:
  workflow_call:
    inputs:
      working-directory:
        description: Directory of the app inside the repository.
        type: string
        default: .
      artifact:
        description: Name of the runtime-gate report artifact from this run.
        type: string
        default: runtime-gate
      max-flows:
        description: Most flows to keep (newest first).
        type: number
        default: 20
      branch:
        type: string
        default: runtime-gate/flows
      ci-workflows:
        description: Workflow files to start on the flows branch, newline-separated (e.g. ci.yml). Each needs workflow_dispatch.
        type: string
        default: ""
      runs-on:
        description: Empty follows the CI_RUNNER variable, then ubuntu-latest.
        type: string
        default: ""

permissions:
  contents: read

jobs:
  save:
    name: Save recorded flows
    if: >-
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
      && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ${{ inputs.runs-on || vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      actions: write
    env:
      FLOWS_FILE: ${{ inputs.working-directory }}/.github/runtime-gate-flows.json
      BRANCH: ${{ inputs.branch }}
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Download the report
        id: report
        continue-on-error: true
        uses: actions/download-artifact@v8.0.2
        with:
          name: ${{ inputs.artifact }}
          path: ${{ runner.temp }}/rg-report

      - name: Collect recorded flows
        id: collect
        run: |
          set -euo pipefail
          new="${RUNNER_TEMP}/rg-report/flows.json"
          files=""
          if [ -s "${new}" ] && grep -q '"action"' "${new}"; then files="${new}"; fi
          # Flows from an earlier week that nobody has merged yet are kept.
          if git fetch --quiet --depth=1 origin "refs/heads/${BRANCH}:refs/remotes/origin/${BRANCH}" 2>/dev/null \
            && git show "origin/${BRANCH}:${FLOWS_FILE#./}" > "${RUNNER_TEMP}/rg-pending.json" 2>/dev/null; then
            files="${files}"$'\n'"${RUNNER_TEMP}/rg-pending.json"
          fi
          if [ -z "${files//[$'\n ']/}" ]; then
            echo "Nothing recorded in this run (the explorer did not run, or found no replayable path)."
          fi
          {
            echo "files<<__RG__"
            echo "${files}"
            echo "__RG__"
          } >> "$GITHUB_OUTPUT"

      - name: Merge into the flows file
        id: merge
        if: steps.collect.outputs.files != ''
        uses: rishitank/.github/.github/actions/runtime-gate@715af0ee0d7198e02581641db2cc10492ae37707
        with:
          mode: merge-flows
          flows-new: ${{ steps.collect.outputs.files }}
          flows-file: ${{ env.FLOWS_FILE }}
          flows-max: ${{ inputs.max-flows }}

      - name: Open or update the PR
        if: steps.merge.outputs.flows-changed == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "${BRANCH}"
          git add -- "${FLOWS_FILE}"
          git commit -q -m "chore(runtime-gate): update recorded flows" \
            -m "Paths the AI explorer completed on ${DEFAULT_BRANCH} in run ${RUN_URL}. The runtime gate replays them on every PR without calling a model."
          git push --force origin "HEAD:refs/heads/${BRANCH}"
          body="Flows the AI explorer completed successfully on \`${DEFAULT_BRANCH}\` ([run](${RUN_URL})).

          Once merged, the runtime gate replays them on every PR with no model calls: a flow that can no longer be done fails dependency-update PRs and is a warning on others.

          Review the steps before merging: they are the paths the gate will insist keep working. Delete any that are not worth keeping.

          _Opened by the runtime-gate-flows workflow. Pull-request workflows do not start on PRs opened by GitHub Actions; the CI workflows listed in its configuration were started on this branch instead._"
          number="$(gh pr list --head "${BRANCH}" --state open --json number --template '{{range .}}{{.number}}{{end}}')"
          if [ -n "${number}" ]; then
            gh pr edit "${number}" --body "${body}" >/dev/null
            echo "Updated PR #${number}"
          elif gh pr create --base "${DEFAULT_BRANCH}" --head "${BRANCH}" --title "chore(runtime-gate): update recorded flows" --body "${body}"; then
            :
          else
            echo "::warning title=runtime-gate-flows::could not open a PR (the repository may not allow GitHub Actions to create pull requests). The branch is pushed: ${SERVER_URL}/${REPO}/compare/${DEFAULT_BRANCH}...${BRANCH}?expand=1"
          fi
          while IFS= read -r wf; do
            wf="${wf%$'\r'}"
            [ -z "${wf// }" ] && continue
            gh workflow run "${wf}" --ref "${BRANCH}" \
              || echo "::warning title=runtime-gate-flows::could not start ${wf} on ${BRANCH} (it needs a workflow_dispatch trigger)"
          done <<< "${CI_WORKFLOWS}"
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SERVER_URL: ${{ github.server_url }}
          REPO: ${{ github.repository }}
          CI_WORKFLOWS: ${{ inputs.ci-workflows }}
